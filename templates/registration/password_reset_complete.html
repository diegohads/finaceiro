{% extends 'base.html' %}
{% block title %}Senha alterada | Nexsaldo{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center p-6">
  <div class="auth-card w-full max-w-lg p-6 text-center sm:p-8">
    <div class="auth-brand mb-8"><span class="auth-brand-mark">N</span>Nexsaldo</div>
    <p class="text-moss font-semibold text-sm mb-3">Tudo certo</p>
    <h1 class="text-3xl mb-3">Sua senha foi redefinida</h1>
    <p class="text-slate-500 mb-8">Agora você pode entrar com a nova senha no painel de acesso.</p>
    <a href="{% url 'login' %}" class="inline-flex rounded-xl bg-moss px-5 py-3 font-semibold text-white transition hover:bg-ink">Ir para o login</a>
  </div>
</div>
{% endblock %}
