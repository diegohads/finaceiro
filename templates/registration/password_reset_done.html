{% extends 'base.html' %}
{% block title %}Link enviado | Nexsaldo{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center p-6">
  <div class="auth-card w-full max-w-lg p-6 text-center sm:p-8">
    <div class="auth-brand mb-8"><span class="auth-brand-mark">N</span>Nexsaldo</div>
    <p class="text-moss font-semibold text-sm mb-3">E-mail enviado</p>
    <h1 class="text-3xl mb-3">Verifique sua caixa de entrada</h1>
    <p class="text-slate-500 mb-8">Se o e-mail informado estiver cadastrado, você receberá um link para redefinir sua senha.</p>
    <a href="{% url 'login' %}" class="inline-flex rounded-xl bg-moss px-5 py-3 font-semibold text-white transition hover:bg-ink">Voltar para o login</a>
  </div>
</div>
{% endblock %}
